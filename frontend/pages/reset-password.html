<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet"/>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#1193D4",
            "primary-hover": "#0F83C0",
          },
          fontFamily: {
            display: ["Montserrat", "sans-serif"],
          },
        },
      },
    };
  </script>

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }

    /* 🔥 Remove browser default password reveal icon */
input[type="password"]::-ms-reveal,
input[type="password"]::-ms-clear {
  display: none;
}

input[type="password"]::-webkit-credentials-auto-fill-button {
  visibility: hidden;
  position: absolute;
  right: 0;
}

  </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#B3E5FC] to-[#81D4FA]">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-black text-gray-900">Reset Password</h1>
      <p class="text-gray-600 mt-2 text-sm">
        Enter a new password for your account
      </p>
    </div>

    <!-- Password Field -->
    <div class="mb-5">
      <label class="block text-sm font-semibold text-gray-700 mb-2">
        New Password
      </label>

      <div class="relative">
        <input
          id="password"
          type="password"
          placeholder="Enter new password"
          class="w-full h-12 rounded-xl bg-gray-100 px-4 pr-12
                 focus:outline-none focus:ring-2 focus:ring-primary"
        />

        <!-- Strength Meter -->
        <div class="mt-3">
          <div class="h-2 w-full rounded-full bg-gray-200 overflow-hidden">
             <div id="strength-bar" class="h-full w-0 transition-all duration-300"></div>
          </div>
          <p id="strength-text" class="text-sm mt-2 font-semibold"></p>
        </div>


        <button
          type="button"
          id="togglePassword"
          class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500"
        >
          👁
        </button>
      </div>
    </div>

    <!-- Submit -->
    <button
      id="resetBtn"
      class="w-full h-12 rounded-xl bg-primary hover:bg-primary-hover
             text-white font-bold tracking-wide transition"
    >
      Reset Password
    </button>

    <!-- Message -->
    <p id="message" class="text-center text-sm mt-4"></p>

  </div>

  <!-- Script -->
<script>
  const passwordInput = document.getElementById("password");
  const strengthBar = document.getElementById("strength-bar");
  const strengthText = document.getElementById("strength-text");
  const toggleBtn = document.getElementById("togglePassword");
  const message = document.getElementById("message");
  const resetBtn = document.getElementById("resetBtn");

  const token = new URLSearchParams(window.location.search).get("token");

  /* 👁 Toggle password */
  toggleBtn.addEventListener("click", () => {
    passwordInput.type =
      passwordInput.type === "password" ? "text" : "password";
    toggleBtn.textContent =
      passwordInput.type === "password" ? "👁" : "🙈";
  });

  /* 🔐 Password strength */
 passwordInput.addEventListener("input", () => {
  const password = passwordInput.value;
  let strength = 0;

  if (password.length >= 8) strength++;
  if (/[A-Z]/.test(password)) strength++;
  if (/[0-9]/.test(password)) strength++;
  if (/[^A-Za-z0-9]/.test(password)) strength++;

  strengthBar.className = "h-full transition-all duration-300";

  isStrongPassword = false;
  resetBtn.disabled = true;
  resetBtn.classList.remove("bg-primary", "hover:bg-primary-hover", "cursor-pointer");
  resetBtn.classList.add("bg-gray-400", "cursor-not-allowed");

  if (strength === 1) {
    strengthBar.style.width = "25%";
    strengthBar.classList.add("bg-red-500");
    strengthText.textContent = "Weak";
    strengthText.className = "text-red-500 text-sm font-semibold";
  }
  else if (strength === 2) {
    strengthBar.style.width = "50%";
    strengthBar.classList.add("bg-yellow-500");
    strengthText.textContent = "Medium";
    strengthText.className = "text-yellow-500 text-sm font-semibold";
  }
  else if (strength === 3) {
    strengthBar.style.width = "75%";
    strengthBar.classList.add("bg-blue-500");
    strengthText.textContent = "Strong";
    strengthText.className = "text-blue-500 text-sm font-semibold";

    // ✅ Enable button
    isStrongPassword = true;
    resetBtn.disabled = false;
    resetBtn.classList.remove("bg-gray-400", "cursor-not-allowed");
    resetBtn.classList.add("bg-primary", "hover:bg-primary-hover", "cursor-pointer");
  }
  else if (strength === 4) {
    strengthBar.style.width = "100%";
    strengthBar.classList.add("bg-green-500");
    strengthText.textContent = "Very Strong";
    strengthText.className = "text-green-600 text-sm font-semibold";

    // ✅ Enable button
    isStrongPassword = true;
    resetBtn.disabled = false;
    resetBtn.classList.remove("bg-gray-400", "cursor-not-allowed");
    resetBtn.classList.add("bg-primary", "hover:bg-primary-hover", "cursor-pointer");
  }
});


  /* 🔁 Reset password */
  resetBtn.addEventListener("click", async () => {
    const password = passwordInput.value.trim();

    if (password.length < 8) {
      message.textContent = "Password must be at least 8 characters";
      message.className = "text-red-500 text-center text-sm mt-4";
      return;
    }

    try {
      const res = await fetch(
        `http://localhost:5000/api/auth/reset-password/${token}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        }
      );

      const data = await res.json();

      if (!res.ok) {
        message.textContent = data.message;
        message.className = "text-red-500 text-center text-sm mt-4";
        return;
      }

      message.textContent = "Password reset successful! Redirecting...";
      message.className = "text-green-600 text-center text-sm mt-4";

      setTimeout(() => {
        window.location.href = "auth.html";
      }, 2000);

    } catch (err) {
      message.textContent = "Server error. Try again later.";
      message.className = "text-red-500 text-center text-sm mt-4";
    }
  });
</script>


</body>
</html>
