<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#1193D4",
              "primary-hover": "#0F83C0",
              "background-light": "#F8FAFC",
              "background-dark": "#101C22",
              "text-primary": "#111518",
              "text-secondary": "#617B89",
            },
            fontFamily: {
              display: ["Montserrat", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "0.75rem",
              xl: "1rem",
              full: "9999px",
            },
            boxShadow: {
              lg: "0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1)",
            },
          },
        },
      };
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="flex h-screen w-full flex-col items-center justify-center bg-gradient-to-br from-[#1193D4] to-[#0B8FCF] p-4 sm:p-6 lg:p-8">
<div class="w-full max-w-md rounded-xl bg-white p-8 shadow-lg sm:p-10 lg:p-12">
<div class="flex flex-col items-center text-center">
<h1 class="text-3xl font-black text-text-primary sm:text-4xl">Forgot Your Password?</h1>
<p class="mt-3 text-base font-normal text-text-secondary">Enter your email address or phone number below and we'll send you a verification code to reset your password.</p>
</div>
<div class="mt-8 flex flex-col gap-6">
<div class="flex flex-col">
<label class="mb-2 text-base font-medium text-text-primary" for="email-phone">Email Address or Phone Number</label>
<input class="form-input h-14 w-full rounded-lg border-none bg-[#f0f3f4] p-4 text-base text-text-primary placeholder-text-secondary focus:border-none focus:outline-none focus:ring-0" id="email-phone" placeholder="Enter your email or phone" type="text" value=""/>
</div>
<button class="flex h-12 w-full items-center justify-center rounded-lg bg-primary px-5 text-base font-bold text-white transition-colors hover:bg-primary-hover">
<span class="truncate">Send Verification Code</span>
</button>
</div>
<div class="mt-6 text-center">
<a class="cursor-pointer text-sm font-medium text-text-secondary underline hover:text-text-primary" href="D:\flexify-vehicle-rental-platform\frontend\pages\Auth.html">Remembered your password? Back to Login</a>
</div>
</div>
</div>

<script>
document.querySelector("button").addEventListener("click", async () => {
  const email = document.getElementById("email-phone").value.trim();

  try {
    const res = await fetch("http://localhost:5000/api/auth/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });

    const data = await res.json();

    if (!res.ok) {
      return alert(data.message);
    }

    alert("Password reset link sent to your email");

  } catch (err) {
    alert("Server error. Try again later.");
  }
});
</script>

</body></html>
