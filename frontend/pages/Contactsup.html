<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Rentify Contact Us</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style type="text/tailwindcss">
        @layer base {
            :root {
                --primary-color: #1193D4;
                --background-light: #F8FAFC;
                --background-dark: #101C22;
                --primary-hover: #0F83C0;
            }
        }
    </style>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "var(--primary-color)",
                        "background-light": "var(--background-light)",
                        "background-dark": "var(--background-dark)",
                        "primary-hover": "var(--primary-hover)"
                    },
                    fontFamily: {
                        "display": ["Montserrat", "sans-serif"],
                        "body": ["Manrope", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-body text-gray-700 dark:text-gray-300">
<div class="min-h-screen">
<section class="bg-primary/10 dark:bg-primary/5 py-12 md:py-16">
<div class="container mx-auto px-4 sm:px-6 lg:px-8 text-center">
<h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 dark:text-white font-display">Get in Touch</h1>
<p class="mt-4 text-lg text-gray-600 dark:text-gray-400">We'd love to hear from you. Let us know how we can help.</p>
</div>
</section>
<main class="container mx-auto px-4 sm:px-6 lg:px-8 py-16">
<div class="grid lg:grid-cols-2 gap-12">
<div class="bg-white dark:bg-gray-800/50 p-8 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700">
<h2 class="text-2xl font-bold font-display text-gray-900 dark:text-white mb-6">Send us a Message</h2>
<form action="#" class="space-y-6">
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="name">Name</label>
<input autocomplete="name" class="w-full px-4 py-3 rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 focus:ring-primary focus:border-primary shadow-sm" id="name" name="name" placeholder="Your Name" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="email">Email Address</label>
<input autocomplete="email" class="w-full px-4 py-3 rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 focus:ring-primary focus:border-primary shadow-sm" id="email" name="email" placeholder="you@example.com" type="email"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="subject">Subject</label>
<input class="w-full px-4 py-3 rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 focus:ring-primary focus:border-primary shadow-sm" id="subject" name="subject" placeholder="How can we help?" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="message">Message</label>
<textarea class="w-full px-4 py-3 rounded-lg border-gray-300 dark:border-gray-600 dark:bg-gray-700 focus:ring-primary focus:border-primary shadow-sm" id="message" name="message" placeholder="Your message..." rows="4"></textarea>
</div>
<div>
<button class="w-full bg-primary text-white font-bold py-3 px-6 rounded-lg shadow-md hover:bg-primary-hover transition-colors text-lg" type="submit">
                                Send Message
                            </button>
</div>
</form>
</div>
<div class="space-y-8">
<div class="bg-white dark:bg-gray-800/50 p-8 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700">
<h2 class="text-2xl font-bold font-display text-gray-900 dark:text-white mb-6">Contact Information</h2>
<div class="space-y-4">
<div class="flex items-center gap-4">
<div class="bg-primary/10 p-3 rounded-full">
<span class="material-symbols-outlined text-primary">mail</span>
</div>
<div>
<h3 class="font-semibold text-gray-900 dark:text-white">Email</h3>
<a class="text-primary hover:underline" href="mailto:support@rentify.com">mohamed.hamdhan0047@gmail.com</a>
</div>
</div>
<div class="flex items-center gap-4">

<span class="material-symbols-outlined text-primary">phone</span>

</div>
</div>
<div class="bg-gray-200 dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 aspect-video w-full flex items-center justify-center">
<div class="text-center p-8">
